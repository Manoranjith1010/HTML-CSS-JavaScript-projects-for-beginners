<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1>💬 Real-Time Chat Room</h1>
            <div class="status-indicator">
                <span id="statusDot" class="status-dot disconnected"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <!-- Username Section -->
        <div class="username-section">
            <input 
                type="text" 
                id="usernameInput" 
                class="username-input" 
                placeholder="Enter your username..."
                maxlength="20"
            >
            <button id="setUsernameBtn" class="set-username-btn">Set Username</button>
            <span id="currentUsername" class="current-username"></span>
        </div>

        <!-- Messages Display Area -->
        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message">
                <p>👋 Welcome to the chat room!</p>
                <p>Set your username and start chatting...</p>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="typing-indicator hidden">
            <span class="typing-user"></span> is typing<span class="typing-dots"><span></span><span></span><span></span></span>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="messageInput" 
                class="message-input" 
                placeholder="Type a message..."
                disabled
            >
            <button id="sendBtn" class="send-btn" disabled>Send</button>
        </div>

        <!-- User List -->
        <div class="users-section">
            <h3>Users Online (<span id="userCount">0</span>)</h3>
            <ul id="usersList" class="users-list">
                <li class="no-users">No users online</li>
            </ul>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
